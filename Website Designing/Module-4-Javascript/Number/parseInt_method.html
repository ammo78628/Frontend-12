<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        var a= '120.505';
        var b= 234;
        document.write("Without using Number Method : "+(a+b)+"<br><br>");
        var c=parseInt(a);
        document.write("With using Number Method : "+(Number(c)+b)+"<br><br>");
    </script>
</head>

</body>
</html>
