    <title>Document</title>
    <script>
        //Reverse only reverse the array that how you creatre it it does not make it sort understand you
        //have to do sort on your own with .sort() method 
        var ary=['harry','sunny','vivek','rajesh','aman','Aarti','Benny','beth'];
        document.write("Before Reversing"+'<br>',ary+'<br>'+'<br>');
        ary.sort();
        document.write("After Sorting"+'<br>',ary+'<br><br>');
        ary.reverse();
        document.write("After Reversing"+'<br>',ary);
    </script>
