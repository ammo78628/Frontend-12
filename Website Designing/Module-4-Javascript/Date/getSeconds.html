<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   
</head>
<body>
    
     <script>
        
        setInterval(()=>{
            document.open();
            var now = new Date;
            var second = now.getSeconds();
            if (second<10) {
             document.write("0"+second)   
            }
            else{
                document.write(second)   
            }      
        },1000);
    </script>
</body>
</html>
