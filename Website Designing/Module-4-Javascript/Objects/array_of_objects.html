<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array of Object</title>
    <script>
        var student = new Array;
        student = [
            {name: 'Rahul', age :15},
            {name: 'Suresh', age :12},
            {name: 'Ajay', age :14}
        ];

        for (let  i = 0; i  < student.length; i++) {
            document.write(student[i].name+' '+student[i].age+'<br>');            
        }
    </script>
</head>
<body>
    
</body>
</html>
