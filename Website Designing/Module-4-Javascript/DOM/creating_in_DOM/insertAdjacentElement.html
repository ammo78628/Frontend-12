
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #outer{
            box-sizing: border-box;
            background-color: teal;
            height: 400px;
            padding: 10px;
        }
        #inner{
            display: flex;
            flex-wrap: wrap;
            box-sizing: border-box;
            background-color: blue;
            min-height: 200px;
            width: 1300px;
            padding: 10px;
        }
        #inner h1{
            flex: 0 0 100%;
            width: 100%;
            margin: 0 0 10px;
        }
    </style>
</head>
<body>
    <div id="outer">
        <h1>Outer</h1>
        <div id="inner">
            <h1>Inner</h1>
        </div>
    </div>
    <script>
        var a = document.createElement("h1");
        a.innerText="Hello User";
        var target = document.getElementById("inner");
        target.insertAdjacentElement("beforebegin",a);
    </script>
</body>
</html>
