<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="openwindow()">Open Window</button>
    <button onclick="resizeit()">Resize Window</button>
    <script>
        var win;
        function openwindow(){
            win = window.open("window_innersize.html",'_blank',"height=800px,width=700px");
            win.document.write("ResizeTo Example!");
        }
        function resizeit(){
            win.resizeTo(200,200);
            win.focus();
        }
    </script>
</body>
</html>
